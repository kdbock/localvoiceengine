[project]
name = "local-voice-engine"
version = "0.1.0"
description = "AI-assisted voice and short-video production workflow for local news."
requires-python = ">=3.9"
dependencies = [
  "imageio",
  "imageio-ffmpeg",
  "pillow"
]

[project.scripts]
local-voice = "qwen_voice_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
